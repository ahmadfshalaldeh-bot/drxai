# ---------------------------------------------------------------------------
# drxai -- default experimental configuration
# Every value below is referenced in the manuscript (Table 3 and Section 3).
# ---------------------------------------------------------------------------
seed: 42
num_classes: 5
class_names: ["Grade 0", "Grade 1", "Grade 2", "Grade 3", "Grade 4"]
referable_threshold: 2          # referable DR := ICDR grade >= 2

paths:
  data_root: data                # raw images + label files (not redistributed)
  cache: cache                   # preprocessed 224x224 tensors (uint8 PNG)
  runs: runs                     # weights, histories, per-fold predictions
  results: results               # metrics, statistics, CSV/LaTeX tables
  figures: ../manuscript/figures # figures consumed by main.tex

datasets:
  eyepacs:
    labels_csv: data/eyepacs/trainLabels.csv       # Kaggle 2015 training labels
    image_dir: data/eyepacs/train
    image_ext: .jpeg
  messidor2:
    labels_csv: data/messidor2/messidor_data.csv   # Krause et al. adjudicated grades
    pairs_csv: data/messidor2/messidor-2_pairs.csv # image_id,exam_id (from messidor-2.xls)
    image_dir: data/messidor2/IMAGES
    drop_ungradable: true                          # 4 images without an adjudicated grade

cv:
  n_folds: 5                     # stratified, patient-grouped
  # iteration k: test = fold k, validation = fold (k+1) mod 5, training = remaining 3 folds

preprocess:
  size: 224
  clahe_clip: 2.0
  clahe_grid: 8
  qc_min_fov_fraction: 0.15      # field-of-view area / image area
  qc_min_contrast: 0.15          # normalised std of green channel inside FOV
  # intensity normalisation is applied inside each network graph with the
  # preprocess_input convention of its ImageNet weights (see drxai/models.py)

augment:                         # applied online, to training mini-batches only
  flip_p: 0.5
  rotation_deg: 180
  brightness: 0.15
  contrast: 0.15
  gaussian_sigma: 0.02

train:
  optimizer: adam
  lr: 1.0e-4
  beta_1: 0.9
  beta_2: 0.999
  batch_size: 16
  max_epochs: 50
  early_stopping_patience: 10    # on validation loss
  reduce_lr_factor: 0.5
  reduce_lr_patience: 5
  dropout: 0.5
  dense_units: 256
  l2: 1.0e-5
  class_weighting: inverse_frequency   # w_c = N_train / (K * N_train,c)

attention:
  se_ratio: 16
  cbam_ratio: 16
  cbam_kernel: 7

# Model zoo. "role" decides where a model appears in Tables 4 and 6.
models:
  vgg16_scratch:   {backbone: vgg16,       attention: none, pretrained: false}
  vgg16:           {backbone: vgg16,       attention: none, pretrained: true}
  vgg19:           {backbone: vgg19,       attention: none, pretrained: true}
  resnet50:        {backbone: resnet50,    attention: none, pretrained: true}
  inceptionv3:     {backbone: inceptionv3, attention: none, pretrained: true}
  vgg16_se:        {backbone: vgg16,       attention: se,   pretrained: true}
  resnet50_cbam:   {backbone: resnet50,    attention: cbam, pretrained: true}
  inceptionv3_se:  {backbone: inceptionv3, attention: se,   pretrained: true}
  dual_branch:     {backbone: dual,        attention: mixed, pretrained: true}
  # optional capacity-matched single-network control (not reported in the paper)
  resnet152_cbam:  {backbone: resnet152,   attention: cbam, pretrained: true}

ensembles:
  proposed:        {members: [vgg16_se, resnet50_cbam, inceptionv3_se], rule: auc_weighted}
  simple_average:  {members: [vgg16_se, resnet50_cbam, inceptionv3_se], rule: mean}
  majority_vote:   {members: [vgg16_se, resnet50_cbam, inceptionv3_se], rule: majority}
  no_attention:    {members: [vgg16, resnet50, inceptionv3],           rule: auc_weighted}

statistics:
  bootstrap_replicates: 1000
  bootstrap_unit: patient        # cluster (patient) bootstrap, stratified by grade
  alpha: 0.05
  multiplicity: holm
  ece_bins: 10
  screening_prevalence: 0.20

xai:
  dataset: messidor2
  annotations_dir: data/messidor2/lesion_masks   # optional; not used in the paper
  n_per_grade: 30                                # stratified held-out audit sample (150 images)
  binarize_percentile: 85
  lime_segments: 64
  lime_compactness: 10
  lime_sigma: 1
  lime_samples: 1000
  shap_background: 50            # background images drawn from the training folds
  shap_samples: 200              # expected-gradient samples (GradientExplainer fallback)
  runtime_repeats: 3
  randomization_layers: 3        # cascading randomisation of the top-k trainable blocks
